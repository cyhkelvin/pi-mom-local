<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="pi-mom-local 系統總覽">
  <title>pi-mom-local 系統總覽</title>
  <style>
    text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 700; }
    .t { font-size: 12.5px; fill: #424a53; }
    .s { font-size: 11px; fill: #57606a; }
    .box { stroke-width: 1.5; rx: 10; }
    .ln { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .dash { stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff" rx="12"/>

  <!-- Slack -->
  <rect class="box" x="20" y="60" width="150" height="95" fill="#f5eefa" stroke="#8250df"/>
  <text class="h" x="95" y="95" text-anchor="middle">Slack</text>
  <text class="t" x="95" y="117" text-anchor="middle">頻道、私訊</text>
  <text class="t" x="95" y="136" text-anchor="middle">使用者在這裡下指令</text>

  <!-- machine frame -->
  <rect x="200" y="20" width="740" height="430" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="s" x="216" y="42">你的機器（沒有雲端推論，對話不離開這台電腦）</text>

  <!-- column A -->
  <rect class="box" x="250" y="60" width="250" height="95" fill="#ddf4ff" stroke="#0969da"/>
  <text class="h" x="375" y="90" text-anchor="middle">runtimes/mom</text>
  <text class="t" x="375" y="112" text-anchor="middle">Slack bot：收訊息、攔截指令、</text>
  <text class="t" x="375" y="131" text-anchor="middle">把回覆和圖片送回 Slack</text>

  <rect class="box" x="250" y="185" width="250" height="95" fill="#dafbe1" stroke="#1a7f37"/>
  <text class="h" x="375" y="215" text-anchor="middle">pi agent</text>
  <text class="t" x="375" y="237" text-anchor="middle">呼叫模型 → 執行 tool → 回填</text>
  <text class="t" x="375" y="256" text-anchor="middle">一直到不再需要 tool 為止</text>

  <rect class="box" x="250" y="310" width="250" height="95" fill="#fff1e5" stroke="#bc4c00"/>
  <text class="h" x="375" y="340" text-anchor="middle">packages/image-router</text>
  <text class="t" x="375" y="362" text-anchor="middle">產圖排隊、GPU 輪替、</text>
  <text class="t" x="375" y="381" text-anchor="middle">管理 sd-server（選用）</text>

  <!-- column B -->
  <rect class="box" x="580" y="60" width="200" height="95" fill="#ffffff" stroke="#6e7781"/>
  <text class="h" x="680" y="90" text-anchor="middle">docker 沙箱</text>
  <text class="t" x="680" y="112" text-anchor="middle">agent 的 bash 在這裡跑</text>
  <text class="t" x="680" y="131" text-anchor="middle">（另有 SearXNG 搜尋）</text>

  <rect class="box" x="580" y="185" width="200" height="95" fill="#ffffff" stroke="#6e7781"/>
  <text class="h" x="680" y="215" text-anchor="middle">ollama</text>
  <text class="t" x="680" y="237" text-anchor="middle">對話模型</text>
  <text class="t" x="680" y="256" text-anchor="middle">（或 LM Studio 等）</text>

  <rect class="box" x="580" y="310" width="200" height="95" fill="#ffffff" stroke="#6e7781"/>
  <text class="h" x="680" y="340" text-anchor="middle">sd-server</text>
  <text class="t" x="680" y="362" text-anchor="middle">FLUX.2 Klein 4B</text>
  <text class="t" x="680" y="381" text-anchor="middle">產圖、改圖</text>

  <!-- GPU -->
  <rect class="box" x="830" y="185" width="90" height="220" fill="#ffebe9" stroke="#cf222e"/>
  <text class="h" x="875" y="280" text-anchor="middle">GPU</text>
  <text class="t" x="875" y="302" text-anchor="middle">只有一張</text>
  <text class="t" x="875" y="321" text-anchor="middle">輪流使用</text>

  <!-- arrows -->
  <line class="ln" x1="170" y1="100" x2="248" y2="100" style="marker-start:url(#a)"/>
  <text class="s" x="209" y="92" text-anchor="middle">Socket</text>
  <text class="s" x="209" y="122" text-anchor="middle">Mode</text>

  <line class="ln" x1="375" y1="155" x2="375" y2="183"/>
  <text class="s" x="383" y="174">一般對話</text>
  <line class="ln" x1="375" y1="280" x2="375" y2="308"/>
  <text class="s" x="383" y="299">generate_image 工具</text>
  <path class="ln" d="M250,130 C226,130 226,350 248,350"/>
  <text class="s" x="216" y="244" text-anchor="middle" transform="rotate(-90 216 244)">!img、!edit 指令</text>

  <line class="ln" x1="500" y1="210" x2="578" y2="120"/>
  <text class="s" x="548" y="158" text-anchor="middle">tool</text>
  <line class="ln" x1="500" y1="245" x2="578" y2="245"/>
  <text class="s" x="539" y="238" text-anchor="middle">模型 API</text>
  <line class="ln" x1="500" y1="365" x2="578" y2="365"/>
  <text class="s" x="539" y="358" text-anchor="middle">啟動、HTTP</text>
  <line class="ln dash" x1="500" y1="330" x2="578" y2="270"/>
  <text class="s" x="551" y="314" text-anchor="middle">卸載</text>

  <line class="ln" x1="780" y1="232" x2="828" y2="232"/>
  <line class="ln" x1="780" y1="357" x2="828" y2="357"/>

  <!-- state -->
  <text class="s" x="216" y="436">資料都在 ~/.pi-mom-local/：對話紀錄、對話記憶、模型和 LoRA、產出的圖、log（不在 repo 裡）</text>
</svg>
