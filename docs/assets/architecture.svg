<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700" role="img" aria-label="pi-mom-local 架構：各層擁有什麼">
  <title>pi-mom-local 架構</title>
  <style>
    text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 700; }
    .hs { font-size: 13.5px; font-weight: 700; }
    .t { font-size: 12px; fill: #424a53; }
    .s { font-size: 11px; fill: #57606a; }
    .code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 11.5px; fill: #424a53; }
    .ln { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .dash { stroke-dasharray: 5 4; }
    .dot { stroke: #8c959f; stroke-width: 1.2; fill: none; stroke-dasharray: 2 3; marker-end: url(#a2); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
  </defs>
  <rect width="1040" height="700" fill="#ffffff" rx="12"/>

  <!-- Slack -->
  <rect x="20" y="95" width="140" height="70" rx="10" fill="#f5eefa" stroke="#8250df" stroke-width="1.5"/>
  <text class="h" x="90" y="124" text-anchor="middle">Slack</text>
  <text class="t" x="90" y="145" text-anchor="middle">訊息、檔案</text>

  <!-- mom frame -->
  <rect x="190" y="40" width="370" height="395" rx="12" fill="#f0f7ff" stroke="#0969da" stroke-width="1.5"/>
  <text class="h" x="206" y="66">runtimes/mom</text>
  <text class="s" x="320" y="66">Slack 專用，一個行程一個</text>

  <rect x="225" y="85" width="315" height="70" rx="8" fill="#fff" stroke="#54aeff"/>
  <text class="hs" x="240" y="108">Slack 介面</text><text class="code" x="330" y="108">slack.ts</text>
  <text class="t" x="240" y="128">Socket Mode、寫 log.jsonl、補抓離線訊息、</text>
  <text class="t" x="240" y="145">發送和上傳、刪自己的訊息</text>

  <rect x="225" y="170" width="315" height="70" rx="8" fill="#fff" stroke="#54aeff"/>
  <text class="hs" x="240" y="193">指令攔截</text><text class="code" x="316" y="193">main.ts intercept()</text>
  <text class="t" x="240" y="213">清除、!lora、!img、!edit、產圖中的訊息：</text>
  <text class="t" x="240" y="230">在這裡處理掉，不進對話模型</text>

  <rect x="225" y="255" width="315" height="70" rx="8" fill="#fff" stroke="#54aeff"/>
  <text class="hs" x="240" y="278">對話編排</text><text class="code" x="316" y="278">main.ts、agent.ts、context.ts</text>
  <text class="t" x="240" y="298">每個頻道一條佇列、補同步、系統提示、</text>
  <text class="t" x="240" y="315">訂閱 pi 的事件 → 送回 Slack</text>

  <rect x="225" y="340" width="315" height="80" rx="8" fill="#fff" stroke="#54aeff"/>
  <text class="hs" x="240" y="363">產圖的 Slack 接線</text>
  <text class="code" x="240" y="382">image-router.ts  slack-image.ts</text>
  <text class="code" x="240" y="399">tools/image.ts（generate_image）</text>
  <text class="t" x="240" y="414">保管 router、實作 ImageNotifier、下載參考圖</text>

  <!-- pi -->
  <rect x="190" y="465" width="370" height="85" rx="12" fill="#eefbf1" stroke="#1a7f37" stroke-width="1.5"/>
  <text class="h" x="206" y="490">pi agent</text>
  <text class="s" x="282" y="490">npm 套件 pi-agent-core、pi-coding-agent、pi-ai</text>
  <text class="t" x="206" y="512">模型和 tool 的循環、session（context.jsonl）、</text>
  <text class="t" x="206" y="530">接近上限時壓縮成摘要、失敗自動重試</text>

  <!-- image-router -->
  <rect x="595" y="40" width="215" height="300" rx="12" fill="#fff8f2" stroke="#bc4c00" stroke-width="1.5"/>
  <text class="h" x="610" y="66">packages/</text>
  <text class="h" x="610" y="86">image-router</text>
  <text class="s" x="610" y="104">不綁定介面，runtime 共用</text>
  <text class="code" x="610" y="130">supervisor</text><text class="t" x="610" y="147">GPU 鎖、排隊、取消、逾時</text>
  <text class="code" x="610" y="172">gpu</text><text class="t" x="610" y="189">卸載和預熱 ollama</text>
  <text class="code" x="610" y="214">server-process sd-client</text><text class="t" x="610" y="231">sd-server 子程序和 API</text>
  <text class="code" x="610" y="256">commands config</text><text class="t" x="610" y="273">指令參數、設定、LoRA</text>
  <text class="code" x="610" y="298">eta png-check ref-image</text><text class="t" x="610" y="315">預估時間、壞圖、參考圖</text>

  <!-- external -->
  <rect x="845" y="95" width="175" height="70" rx="10" fill="#fff" stroke="#6e7781" stroke-width="1.5"/>
  <text class="h" x="932" y="123" text-anchor="middle">sd-server</text>
  <text class="t" x="932" y="144" text-anchor="middle">FLUX.2 Klein 4B</text>

  <rect x="845" y="195" width="175" height="140" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text class="h" x="932" y="258" text-anchor="middle">GPU</text>
  <text class="t" x="932" y="280" text-anchor="middle">同時只給一邊用</text>

  <rect x="845" y="365" width="175" height="70" rx="10" fill="#fff" stroke="#6e7781" stroke-width="1.5"/>
  <text class="h" x="932" y="393" text-anchor="middle">ollama</text>
  <text class="t" x="932" y="414" text-anchor="middle">對話模型</text>

  <rect x="845" y="472" width="175" height="70" rx="10" fill="#fff" stroke="#6e7781" stroke-width="1.5"/>
  <text class="h" x="932" y="500" text-anchor="middle">docker 沙箱</text>
  <text class="t" x="932" y="521" text-anchor="middle">tool 在這裡執行</text>

  <!-- arrows -->
  <line class="ln" x1="160" y1="125" x2="223" y2="125" style="marker-start:url(#a)"/>
  <line class="ln" x1="382" y1="155" x2="382" y2="168"/>
  <line class="ln" x1="382" y1="240" x2="382" y2="253"/>
  <text class="s" x="390" y="251">沒被攔截</text>
  <path class="ln" d="M225,305 C200,305 200,470 215,478" />
  <line class="ln" x1="540" y1="205" x2="593" y2="205"/>
  <text class="s" x="566" y="197" text-anchor="middle">指令</text>
  <line class="ln" x1="595" y1="320" x2="542" y2="370"/>
  <text class="s" x="592" y="360">ImageNotifier</text>
  <line class="ln" x1="500" y1="465" x2="650" y2="342"/>
  <text class="s" x="596" y="392">generate_image</text>

  <line class="ln" x1="810" y1="130" x2="843" y2="130"/>
  <line class="ln" x1="932" y1="165" x2="932" y2="193"/>
  <line class="ln" x1="932" y1="365" x2="932" y2="337"/>
  <line class="ln dash" x1="810" y1="300" x2="855" y2="363"/>
  <text class="s" x="818" y="350">卸載</text>
  <line class="ln" x1="560" y1="485" x2="843" y2="410"/>
  <text class="s" x="700" y="438" text-anchor="middle">OpenAI 相容 API</text>
  <line class="ln" x1="560" y1="515" x2="843" y2="510"/>
  <text class="s" x="700" y="505" text-anchor="middle">tool（bash 等）</text>

  <!-- state -->
  <rect x="20" y="580" width="1000" height="105" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text class="hs" x="36" y="604">資料（~/.pi-mom-local/，不在 repo 裡）</text>
  <text class="code" x="36" y="630">channels/&lt;頻道&gt;/log.jsonl</text><text class="s" x="36" y="647">所有訊息（mom 寫）</text>
  <text class="code" x="230" y="630">context.jsonl</text><text class="s" x="230" y="647">對話記憶（pi 寫）</text>
  <text class="code" x="370" y="630">MEMORY.md</text><text class="s" x="370" y="647">長期筆記（agent 寫）</text>
  <text class="code" x="520" y="630">workspace/images/</text><text class="s" x="520" y="647">產出的圖（image-router）</text>
  <text class="code" x="700" y="630">models/image/flux2/</text><text class="s" x="700" y="647">模型、loras/、nsfw/</text>
  <text class="code" x="870" y="630">logs/</text><text class="s" x="870" y="647">mom.log、sd-server.log</text>
  <text class="s" x="36" y="672">實線：呼叫或資料流　虛線：產圖前把對話模型移出 GPU</text>
</svg>
